<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>ストップウォッチ</title>
    <link rel="stylesheet" href="main.css" />
    <!-- jQuery を使う場合は読み込む -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <!-- ここに表示部分とボタンを書いていきましょう -->
    <div class="calculator">
      <div class="result"></div>
      <div class="wrapper">
        <div class="row">
          <button class="number07">7</button>
          <button class="number08">8</button>
          <button class="number09">9</button>
          <button class="plus">+</button>
        </div>
        <div class="row">
          <button class="number04">4</button>
          <button class="number05">5</button>
          <button class="number06">6</button>
          <button class="minus">-</button>
        </div>
        <div class="row">
          <button class="number01">1</button>
          <button class="number02">2</button>
          <button class="number03">3</button>
          <button class="multiply">×</button>
        </div>
        <div class="row">
          <button class="number00">0</button>
          <button class="clear">00</button>
          <button class="equal">.</button>
          <button class="divide">/</button>
        </div>
        <div class="row">
          <button class="clear">AC</button>
          <button class="equal">=</button>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
